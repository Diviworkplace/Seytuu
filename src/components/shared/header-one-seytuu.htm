<!-- =========================
Header v1
===========================-->
<header>
  <div
    class="header-one opacity-0 w-full fixed left-0 z-50 top-0 flex items-center justify-between px-5 xl:py-0 py-2.5 {=$class}"
    data-ns-animate
    data-direction="up"
    data-offset="100"
  >
    <div>
      <a href="./index.html" class="flex items-center">
        <span class="sr-only">Home</span>
      
        <!-- Desktop logo -->
        <figure class="hidden lg:block w-[300px]">
          <span class="flex items-center">
          <img
            src="/images/seytuu/Monograms.svg"
            alt="Seytuu"
            class="w-1/6"
          />
          <img
            src="/images/seytuu/Logo-Type.svg"
            alt="Seytuu"
            class="w-1/3 dark:invert align-bottom"
          />
          </span>
        </figure>
      
        <!-- Mobile logo -->
        <figure class="lg:hidden block w-[44px]">
          <img
            src="/images/seytuu/Logo-Type.svg"
            alt="Seytuu"
            class="w-full dark:invert"
          />
        </figure>
      </a>
    </div>

    <nav class="hidden xl:flex items-center">
      <ul class="flex items-center">
        <li class="relative nav-item cursor-pointer py-2.5" data-menu="home-mega-menu">
          <a href="#" class="nav-item-link {=$nav-item-class}">
            <span>About Us</span>
          </a>
        </li>
        <li class="relative nav-item cursor-pointer py-2.5" data-menu="services-mega-menu">
          <a href="#" class="nav-item-link {=$nav-item-class}">
            <span>Services</span>
            <span class="nav-arrow block origin-center transition-all duration-300 translate-y-px">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </span>
          </a>
          <Component src="src/components/shared/services-mega-menu-seytuu.htm" class="{=$mega-menu-color}" />
        </li>
        <li class="relative nav-item cursor-pointer py-2.5" data-menu="solutions-mega-menu">
          <a href="#" class="nav-item-link {=$nav-item-class}">
            <span>Solutions</span>
            <span class="nav-arrow block origin-center transition-all duration-300 translate-y-px">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </span>
          </a>
          <Component src="src/components/shared/solutions-mega-menu-seytuu.htm" class="{=$mega-menu-color}" />
        </li>
        <li class="relative nav-item cursor-pointer py-2.5" data-menu="resources-menu">
          <a href="#" class="nav-item-link {=$nav-item-class}">
            <span>Resources</span>
            <span class="nav-arrow block origin-center transition-all duration-300 translate-y-px">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </span>
          </a>
          <Component src="src/components/shared/resources-menu.htm" class="{=$mega-menu-color}" />
        </li>
        <li class="relative nav-item cursor-pointer py-2.5" data-menu="services-menu">
          <a href="#" class="nav-item-link {=$nav-item-class}">
            <span>Careers</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="xl:flex hidden items-center justify-center">
      <a href="./signup-page-01.html" class="btn btn-md {=$btn-class}">
        <span>Get started</span>
      </a>
    </div>
    <div class="xl:hidden block">
      <button
        class="nav-hamburger flex flex-col gap-[5px] size-12 bg-background-4 dark:bg-background-6 rounded-full items-center justify-center cursor-pointer"
      >
        <span class="sr-only">Menu</span>
        <span class="block w-6 h-0.5 bg-stroke-9 dark:bg-stroke-1"></span>
        <span class="block w-6 h-0.5 bg-stroke-9 dark:bg-stroke-1"></span>
        <span class="block w-6 h-0.5 bg-stroke-9 dark:bg-stroke-1"></span>
      </button>
    </div>
  </div>
  <Component src="src/components/shared/mobile-menu.htm" />
</header>
